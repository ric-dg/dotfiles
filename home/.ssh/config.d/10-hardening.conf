# ssh: defaults for every host. Included at the END of ~/.ssh/config (after `Match all`)
# by install.sh, so per-host settings above it win (ssh uses the first value it sees).
# Your host list stays in ~/.ssh/config, never in this repo.
Host *
    # reuse one connection per host: new tabs/scp/git to a server open instantly
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C
    ControlPersist 10m
    ServerAliveInterval 60
    ServerAliveCountMax 10
    # post-quantum hybrid key exchange first
    KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
    # AES-GCM first: much cheaper than ChaCha20 on CPUs with AES-NI (ChaCha20 kept as fallback)
    Ciphers aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
    MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
    IdentitiesOnly yes
    VisualHostKey yes
