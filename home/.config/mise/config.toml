# mise: optional user-level tools for machines whose packages are too old or where you
# have no root (`./install.sh tools`). Pinned to minor versions: patch updates only.
# On Arch the laptop uses pacman instead.
[tools]
neovim = "0.12"
tmux = "3.8"
fzf = "0.74"
ripgrep = "15.2"
fd = "10.5"
jq = "1.8"
bat = "0.26"
eza = "0.23"
zoxide = "0.10"
gh = "2"
