# tmux, one file for laptop and servers (dotpush sends it to servers as ~/.tmux.conf so
# old tmux finds it). Options an old tmux doesn't know are reported and skipped.

# shell: fish when installed, otherwise POSIX /bin/sh
run-shell 'f=$(command -v fish) || f=/bin/sh; tmux set -g default-shell "$f"'

# tmux-256color where its terminfo exists, else the universally available screen-256color
set -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -ga terminal-overrides ",xterm-256color:Tc"   # true colour (old and new tmux)
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB,konsole*:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10           # no lag after Esc in Neovim/vim
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on          # copies reach the local clipboard, also through ssh (OSC 52)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# y copies; on a Wayland desktop also into wl-copy directly
if-shell 'command -v wl-copy >/dev/null 2>&1' \
	'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' \
	'bind -T copy-mode-vi y send -X copy-selection-and-cancel'

# splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r if-shell 'test -r ~/.tmux.conf' 'source-file ~/.tmux.conf' 'source-file ~/.config/tmux/tmux.conf' \; display "tmux config reloaded"

# quiet status line; host name highlighted, so you always know which machine a tab is on
set -g status-interval 15
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour39]#S "
set -g status-right "#[fg=colour214,bold]#H#[default] %H:%M"
setw -g window-status-current-style "fg=colour39,bold"

# Nested tmux (laptop tmux -> ssh -> server tmux): a tmux started inside an ssh session
# puts its status bar on top, in a different shade, so the two bars never look alike.
# Keys go to the inner (server) tmux with the prefix pressed twice: C-b C-b ...
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g status-position top ; set -g status-style "bg=colour236,fg=colour250"'
