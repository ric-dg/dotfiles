name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash fish tmux neovim shellcheck
      - name: Lint
        run: shellcheck install.sh bin/* tests/*.sh .githooks/pre-commit
      - name: Privacy
        run: sh tests/privacy.sh
      - name: Test
        run: sh tests/run.sh
